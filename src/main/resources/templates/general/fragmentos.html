<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">
        <title>TechShop</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <link href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="/webjars/font-awesome/6.7.2/css/all.min.css" rel="stylesheet"/>
        <link th:href="@{/css/style.css}" rel="stylesheet"/>

        <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
        <script src="/webjars/popper.js/2.11.7/umd/popper.min.js"></script>
        <script src="/webjars/bootstrap/5.3.7/js/bootstrap.min.js"></script>
    </head>

    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">

                <a class="navbar-brand" th:href="@{/}">TechShop</a>

                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Categorías</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Extras</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Administración</a>
                    </li>
                </ul>

                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                           href="#"
                           role="button"
                           data-bs-toggle="dropdown">
                            Idioma
                        </a>

                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" th:href="@{/(lang=es)}">Español</a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/(lang=en)}">English</a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/(lang=fr)}">Français</a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/(lang=pt)}">Português</a>
                            </li>
                        </ul>
                    </li>
                </ul>

            </div>
        </nav>
    </header>

    <footer th:fragment="footer" class="bg-info text-white text-center p-3 mt-4">
        TechShop Derechos Reservados 2026 &COPY;
    </footer>

</html>
